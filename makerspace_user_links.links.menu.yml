# "Your Dashboards" launcher row (menu: your-dashboards) — one card per role
# hub, rendered by the makerspace_role_menu_cards block on /resources. The
# block access-filters the tree, so each member sees only the hubs they can
# reach. Keep to genuine role/permission-gated dashboards. CiviCRM's route is
# `_access: TRUE` (it gates internally), so its card carries an explicit
# mh_access_permission for the block to honor.
#
# The per-role quick-link menus (facilitator-menu, business-resources) now
# render on their own dashboard pages rather than on /resources, so their old
# code-defined "lead dashboard" links were removed from here (they would have
# been self-links on those pages); the launcher row below is the single entry
# point to each dashboard.
makerspace_user_links.dash.staff_tools:
  title: 'Staff Tools Dashboard'
  description: 'All staff reports, queues, and operational tools in one organized place.'
  route_name: makerspace_staff_tools.dashboard
  menu_name: your-dashboards
  weight: 0
  options:
    attributes:
      data-icon: tools

makerspace_user_links.dash.instructor:
  title: 'Instructor Dashboard'
  description: 'Your classes, attendance, and post-event tasks.'
  route_name: instructor_companion.dashboard
  menu_name: your-dashboards
  weight: 10
  options:
    attributes:
      data-icon: mortarboard

makerspace_user_links.dash.facilitator:
  title: 'Facilitator Dashboard'
  description: 'Your appointments, availability, and facilitation stats.'
  route_name: appointment_facilitator.dashboard
  menu_name: your-dashboards
  weight: 20
  options:
    attributes:
      data-icon: calendar-check

makerspace_user_links.dash.civicrm:
  title: 'CiviCRM'
  description: 'Contacts, contributions, events, and mailings.'
  url: 'internal:/civicrm'
  menu_name: your-dashboards
  weight: 30
  options:
    mh_access_permission: 'access CiviCRM'
    attributes:
      data-icon: people

makerspace_user_links.dash.facilitator_utilities:
  title: 'Facilitator utilities'
  description: 'Badge approvals, member search, nametags and guides.'
  route_name: entity.node.canonical
  route_parameters:
    node: '34702'
  menu_name: your-dashboards
  weight: 21
  options:
    mh_access_permission: 'view own facilitator stats'
    attributes:
      data-icon: wrench-adjustable

makerspace_user_links.dash.equipment_status:
  title: 'Equipment status'
  description: 'What is up, down or waiting on repair.'
  route_name: asset_status.tool_status_board
  menu_name: your-dashboards
  weight: 22
  options:
    mh_access_permission: 'view own facilitator stats'
    attributes:
      data-icon: activity

makerspace_user_links.dash.content:
  title: 'Site content'
  description: 'Pages, blog posts and other site content.'
  route_name: system.admin_content
  menu_name: your-dashboards
  weight: 35
  options:
    # Facilitators can see the content list (a role permission), but it is not
    # their job; editors and staff carry 'administer media'.
    mh_access_permission: 'administer media'
    attributes:
      data-icon: file-earmark-text

makerspace_user_links.dash.newsletter:
  title: 'Newsletter console'
  description: 'Weekly digest and monthly newsletter.'
  route_name: makerspace_digest_scheduler.console
  menu_name: your-dashboards
  weight: 36
  options:
    attributes:
      data-icon: envelope-paper

# Members hold 'access administration pages' too, so the site-admin overview
# is gated on a permission only editors and staff carry.
makerspace_user_links.dash.site_admin:
  title: 'Site admin'
  description: 'Structure, media, configuration and help.'
  route_name: system.admin
  menu_name: your-dashboards
  weight: 37
  options:
    mh_access_permission: 'administer media'
    attributes:
      data-icon: sliders

