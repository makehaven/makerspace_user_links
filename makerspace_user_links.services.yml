services:
  makerspace_user_links.link_manager:
    class: Drupal\makerspace_user_links\Service\UserLinkManager
    arguments:
      - '@module_handler'
      - '@string_translation'

  makerspace_user_links.member_bar:
    class: Drupal\makerspace_user_links\MemberBar
    arguments:
      - '@menu.link_tree'
      - '@current_user'
      - '@path.current'
      - '@extension.list.theme'
      - '@file_url_generator'

  makerspace_user_links.route_subscriber:
    class: Drupal\makerspace_user_links\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }

  makerspace_user_links.assigned_activities:
    class: Drupal\makerspace_user_links\AssignedActivities\AssignedActivities
    arguments:
      - '@module_handler'

  makerspace_user_links.assignment_notifier:
    class: Drupal\makerspace_user_links\AssignedActivities\AssignmentNotifier
    arguments:
      - '@makerspace_user_links.assigned_activities'
      - '@entity_type.manager'
      - '@plugin.manager.mail'
      - '@current_user'
      - '@logger.channel.makerspace_user_links'

  logger.channel.makerspace_user_links:
    parent: logger.channel_base
    arguments: ['makerspace_user_links']

  makerspace_user_links.member_hub_login_redirect:
    class: Drupal\makerspace_user_links\EventSubscriber\MemberHubLoginRedirect
    arguments:
      - '@current_user'
      - '@path_alias.manager'
      - '@messenger'
    tags:
      - { name: event_subscriber }
