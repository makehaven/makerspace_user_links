# Member journey pages (JR 2026-10-06, "grouping B"): the member bar's four
# areas. Each page renders its journey-* menu as grouped cards; see
# JourneyController. Served in the member theme by the theme_switcher rule
# member_only_theme.
makerspace_user_links.journey_make:
  path: '/member/make'
  defaults:
    _controller: '\Drupal\makerspace_user_links\Controller\JourneyController::page'
    _title: 'Make'
    journey: make
  requirements:
    _user_is_logged_in: 'TRUE'

makerspace_user_links.journey_learn:
  path: '/member/learn'
  defaults:
    _controller: '\Drupal\makerspace_user_links\Controller\JourneyController::page'
    _title: 'Learn'
    journey: learn
  requirements:
    _user_is_logged_in: 'TRUE'

makerspace_user_links.journey_connect:
  path: '/member/connect'
  defaults:
    _controller: '\Drupal\makerspace_user_links\Controller\JourneyController::page'
    _title: 'Connect'
    journey: connect
  requirements:
    _user_is_logged_in: 'TRUE'

# Open to every member; the Business dashboard entry (your-dashboards) is
# offered only to members whose goal is selling or a business (GrowAccess).
makerspace_user_links.journey_grow:
  path: '/member/grow'
  defaults:
    _controller: '\Drupal\makerspace_user_links\Controller\JourneyController::page'
    _title: 'Grow'
    journey: grow
  requirements:
    _user_is_logged_in: 'TRUE'

# Open CiviCRM activities assigned to the viewer (Kate, 2026-10-22). Staff
# also get an email per assignment; see AssignmentNotifier.
makerspace_user_links.assigned_to_me:
  path: '/assigned-to-me'
  defaults:
    _controller: '\Drupal\makerspace_user_links\Controller\AssignedToMeController::page'
    _title: 'Assigned to me'
  requirements:
    _permission: 'access CiviCRM'
  options:
    _admin_route: TRUE
